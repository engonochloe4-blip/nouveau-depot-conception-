<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supervision VMware</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .status-card {
            background: #f8f9fa;
            padding: 20px;
            margin: 20px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .status-card h3 {
            margin-bottom: 10px;
            color: #333;
        }

        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: bold;
        }

        .status-badge.simulation {
            background: #fff3cd;
            color: #856404;
        }

        .status-badge.ok {
            background: #d4edda;
            color: #155724;
        }

        .content {
            padding: 30px;
        }

        .section {
            margin-bottom: 30px;
        }

        .section h2 {
            color: #333;
            margin-bottom: 15px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .vms-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .vm-card {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 15px;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .vm-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .vm-name {
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
            font-size: 1.1em;
        }

        .vm-info {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 5px;
        }

        .vm-actions {
            margin-top: 10px;
            display: flex;
            gap: 10px;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9em;
            transition: opacity 0.3s;
            flex: 1;
        }

        button:hover {
            opacity: 0.9;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .history {
            background: #f8f9fa;
            border-radius: 8px;
            overflow: hidden;
        }

        .history-item {
            padding: 15px;
            border-bottom: 1px solid #dee2e6;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .history-item:last-child {
            border-bottom: none;
        }

        .action-tag {
            display: inline-block;
            padding: 4px 8px;
            background: #667eea;
            color: white;
            border-radius: 4px;
            font-size: 0.8em;
            font-weight: bold;
            margin-right: 10px;
        }

        .status-success {
            color: #28a745;
        }

        .status-error {
            color: #dc3545;
        }

        .status-date {
            color: #999;
            font-size: 0.9em;
        }

        .loading {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .alert {
            padding: 15px;
            margin: 15px 0;
            border-radius: 5px;
            display: none;
        }

        .alert.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .alert.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🖥️ Supervision VMware</h1>
            <p>Gestion et monitoring des machines virtuelles</p>
        </header>

        <div class="content">
            <!-- Status Card -->
            <div class="status-card" id="statusCard">
                <h3>État du Système</h3>
                <div id="statusContent">
                    <span class="loading"></span> Vérification de l'état...
                </div>
            </div>

            <!-- Alert Messages -->
            <div id="alertContainer"></div>

            <!-- VMs Section -->
            <div class="section">
                <h2>📋 Machines Virtuelles</h2>
                <div id="vmsList" class="vms-list">
                    <div style="grid-column: 1 / -1; text-align: center;">
                        <span class="loading"></span> Chargement des VMs...
                    </div>
                </div>
            </div>

            <!-- History Section -->
            <div class="section">
                <h2>📜 Historique des Opérations</h2>
                <div id="historyList" class="history">
                    <div style="padding: 15px; text-align: center;">
                        <span class="loading"></span> Chargement...
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Fetch Status
        async function fetchStatus() {
            try {
                const response = await fetch('/vmware/status');
                const data = await response.json();

                let statusHTML = `
                    <span class="status-badge ${data.simulation ? 'simulation' : 'ok'}">
                        ${data.simulation ? '🔄 Simulation' : '✅ Connecté'}
                    </span>
                    <p style="margin-top: 10px; color: #666;">
                        ${data.message || 'Système operationnel'}
                    </p>
                `;
                document.getElementById('statusContent').innerHTML = statusHTML;
            } catch (error) {
                document.getElementById('statusContent').innerHTML = '<span style="color: red;">❌ Erreur</span>';
            }
        }

        // Fetch VMs
        async function fetchVMs() {
            try {
                const response = await fetch('/vmware/vms');
                const data = await response.json();

                let vmsHTML = '';
                if (data.vms && data.vms.length > 0) {
                    data.vms.forEach(vm => {
                        const vmName = vm.name || vm;
                        vmsHTML += `
                            <div class="vm-card">
                                <div class="vm-name">🖥️ ${vmName}</div>
                                <div class="vm-info">
                                    État: ${vm.power_state || 'Inconnu'}
                                </div>
                                ${vm.cpu ? `<div class="vm-info">CPU: ${vm.cpu}</div>` : ''}
                                ${vm.memory_mb ? `<div class="vm-info">RAM: ${vm.memory_mb} MB</div>` : ''}
                                <div class="vm-actions">
                                    <button onclick="createSnapshot('${vmName}')">📸 Snapshot</button>
                                    <button onclick="restoreSnapshotPrompt('${vmName}')">↩️ Restore</button>
                                </div>
                            </div>
                        `;
                    });
                } else {
                    vmsHTML = '<p style="grid-column: 1 / -1;">Aucune VM disponible</p>';
                }
                document.getElementById('vmsList').innerHTML = vmsHTML;
            } catch (error) {
                document.getElementById('vmsList').innerHTML = `<p style="grid-column: 1 / -1; color: red;">Erreur de chargement</p>`;
            }
        }

        // Restore Snapshot
        function restoreSnapshotPrompt(vmName) {
            const snapshotName = prompt(`Entrez le nom du snapshot à restaurer pour ${vmName}:`);
            if (snapshotName) {
                restoreSnapshot(vmName, snapshotName);
            }
        }

        async function restoreSnapshot(vmName, snapshotName) {
            try {
                const response = await fetch('/vmware/restore-snapshot', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        vm_name: vmName,
                        snapshot_name: snapshotName
                    })
                });
                const data = await response.json();

                if (response.ok) {
                    showAlert('success', `✅ Snapshot '${snapshotName}' restauré pour ${vmName}`);
                    fetchHistory();
                } else {
                    showAlert('error', `❌ Erreur: ${data.error || data.message}`);
                }
            } catch (error) {
                showAlert('error', `❌ Erreur lors de la restauration du snapshot`);
            }
        }

        // Create Snapshot
        async function createSnapshot(vmName) {
            try {
                const response = await fetch('/vmware/snapshot', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        vm_name: vmName,
                        snapshot_name: `snapshot-${new Date().getTime()}`
                    })
                });
                const data = await response.json();

                if (response.ok) {
                    showAlert('success', `✅ Snapshot créé pour ${vmName}`);
                    fetchHistory();
                } else {
                    showAlert('error', `❌ Erreur: ${data.error || data.message}`);
                }
            } catch (error) {
                showAlert('error', `❌ Erreur lors de la création du snapshot`);
            }
        }

        // Fetch History
        async function fetchHistory() {
            try {
                const response = await fetch('/history');
                const data = await response.json();

                let historyHTML = '';
                if (data.history && data.history.length > 0) {
                    data.history.forEach(item => {
                        const statusClass = item.status === 'succès' ? 'status-success' : 'status-error';
                        historyHTML += `
                            <div class="history-item">
                                <div>
                                    <span class="action-tag">${item.action.toUpperCase()}</span>
                                    ${item.vm_name ? `<strong>${item.vm_name}</strong> - ` : ''}
                                    <span class="${statusClass}">${item.status}</span>
                                </div>
                                <span class="status-date">${item.created_at}</span>
                            </div>
                        `;
                    });
                } else {
                    historyHTML = '<div style="padding: 15px; text-align: center; color: #999;">Aucune opération</div>';
                }
                document.getElementById('historyList').innerHTML = historyHTML;
            } catch (error) {
                document.getElementById('historyList').innerHTML = '<div style="padding: 15px; color: red;">Erreur de chargement</div>';
            }
        }

        // Show Alert
        function showAlert(type, message) {
            const alertContainer = document.getElementById('alertContainer');
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert ${type}`;
            alertDiv.textContent = message;
            alertContainer.appendChild(alertDiv);

            setTimeout(() => {
                alertDiv.remove();
            }, 3000);
        }

        // Initial Load
        document.addEventListener('DOMContentLoaded', () => {
            fetchStatus();
            fetchVMs();
            fetchHistory();

            // Refresh every 10 seconds
            setInterval(() => {
                fetchStatus();
                fetchHistory();
            }, 10000);
        });
    </script>
</body>
</html>
